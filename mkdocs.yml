# Конфігурація сайту
site_name: 'Плагін XML-UA для QGIS'
site_url: 'https://your-github-username.github.io/xml_ua_docs/' # TODO: Замініть на ваш URL
site_author: 'Ваше імʼя або назва організації'
site_description: 'Документація для плагіна XML-UA, який спрощує роботу з кадастровими XML-файлами в QGIS.'

# Авторські права
copyright: 'Copyright &copy; 2024, Ваше імʼя'

# Репозиторій
repo_url: 'https://github.com/your-github-username/xml_ua_docs' # TODO: Замініть на URL вашого репозиторію
repo_name: 'xml_ua_docs'
edit_uri: 'edit/main/docs/' # Шлях для редагування сторінок прямо з сайту

# Тема
theme:
  name: material
  language: uk
  logo: images/icon.png
  favicon: images/icon.png
  features:
    - navigation.tabs # Навігація у вигляді вкладок
    - navigation.top # Кнопка "Нагору"
    - navigation.sections # Розділи в бічній панелі
    - search.suggest # Пропозиції при пошуку
    - search.highlight # Підсвічування результатів пошуку
    - content.code.copy # Кнопка копіювання для блоків коду
    - content.tabs.link # Посилання на конкретні вкладки в контенті
  palette:
    # Світла тема
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Перемкнути на темну тему
    # Темна тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Перемкнути на світлу тему

# Структура навігації
nav:
  - 'Головна': 'index.md'
  - 'Встановлення':
    - 'Встановлення QGIS': 'install_qgis.md'
    - 'Встановлення плагіна': 'install_plugin.md'
  - 'Основні можливості':
    - 'Створення нового XML': 'new_xml.md'
    - 'Візуальний контроль геометрії': 'visual_control.md'
  - 'Довідник':
    - 'Системи координат': 'crs.md'
  - 'Часті питання (FAQ)': 'faq.md' # Файл-заглушка, який можна створити