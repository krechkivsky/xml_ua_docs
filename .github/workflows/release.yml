name: Release docs (Pages + ZIP)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_publish_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install MkDocs tooling
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material ghp-import

      - name: Build site
        run: mkdocs build

      - name: Create offline ZIP
        run: |
          cd site
          zip -r ../xml_ua_docs-site.zip .

      # Keep publishing mechanism aligned with local `publication.bat`
      # (mkdocs build + ghp-import to gh-pages).
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish to GitHub Pages (gh-pages branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ghp-import -n -p -f site

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: xml_ua_docs-site.zip
